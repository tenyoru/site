<!-- Ljft side: Name + Theme switch -->
<div class="header-left">
  <h1 class="site-title">
    <a href="{{ "/" | relURL }}">{{ site.Title }}</a>
  </h1>
</div>

<!-- Right side: Menu -->
<nav class="header-menu">
  <details class="menu-mobile">
    <summary class="menu-toggle" aria-label="Toggle menu">
      <span class="sr-only">Toggle menu</span>
    </summary>

  </details>

  <!-- desktop menu -->
  <div class="menu-desktop">
    {{ $page := . }}
    {{ with site.Menus.main }}
      {{ range . }}
        <a href="{{ .URL }}" class="{{ if strings.HasPrefix $page.RelPermalink .URL }}active{{ end }}">
          {{ .Name }}
        </a>
      {{ end }}
    {{ end }}
  </div>
</nav>
