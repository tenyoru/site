baseURL = 'https://tenyoru.io/'
locale = 'en-us'
title = 'Tenyoru'
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
capitalizeListTitles = false

# Generates static/_headers as a Hugo output (see layouts/index.headers) so
# it can reference the current build's fingerprinted CSS URL for the Link
# preload header - a plain static/_headers file can't see that hash.
[mediaTypes."text/netlify"]
delimiter = ""
suffixes = []

[outputFormats.Headers]
mediaType = "text/netlify"
baseName = "_headers"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "RSS", "Headers"]

[languages]
  [languages.en]
    weight = 1
  [languages.fr]
    weight = 2
  [languages.ru]
    weight = 3

[params]
description = "A personal corner for engineering notes, writing, and new collaborations"
r2BaseURL = "https://assets.tenyoru.io"
r2Transforms = true
r2Thumb = "cdn-cgi/image/width=600,format=webp"

[params.banner]
enabled = true
text = "Hiring? I'm open to new roles."
url = "/contact/"

[params.contact.contacts]

  [[params.contact.contacts.items]]
  label = "Email"
  value = "mail@tenyoru.io"
  url = "mailto:mail@tenyoru.io"
  icon = "mail"

  # [[params.contact.contacts.items]]
  # label = "Matrix"
  # value = "@a:tenyoru.io"
  # url = "https://matrix.to/#/@a:tenyoru.io"
  # icon = "matrix"

  [[params.contact.contacts.items]]
  label = "Telegram"
  value = "@tenyoru"
  url = "https://t.me/tenyoru"
  icon = "telegram"

  [[params.contact.contacts.items]]
  label = "WhatsApp"
  # value = "+44 745 689 1686"
  # url = "https://wa.me/447456891686"
  value = "Available if you already have my number"
  icon = "whatsapp"

[[params.media]]
label = "GitHub"
value = "tenyoru"
url = "https://github.com/tenyoru"
icon = "github"

# [[params.media]]
# label = "Codeberg"
# value = "tenyoru"
# url = "https://codeberg.org/tenyoru"
# icon = "codeberg"

[[params.media]]
label = "Bluesky"
value = "@tenyoru.io"
url = "https://bsky.app/profile/tenyoru.io"
icon = "bluesky"

[[params.media]]
label = "Mastodon"
value = "@tenyoru@mastodon.social"
url = "https://mastodon.social/@tenyoru"
icon = "mastodon"

[[params.media]]
label = "Telegram"
value = "@tenyoru"
url = "https://t.me/tenyoru_hub"
icon = "telegram"

[[params.projects]]
name = "topo.love"
desc = "Past side project"
url = "https://topo.love"
icon = "topo"

[params.footer]
credits = "© 2026 Tenyoru"

[params.license]
name = "CC BY-NC-SA 4.0"
url = "https://creativecommons.org/licenses/by-nc-sa/4.0/"

[params.repo]
url = "https://github.com/tenyoru/site"

[params.giscus]
repo = "tenyoru/Tenyoru.github.io"
repoID = "R_kgDOP75SYA"
category = "Announcements"
categoryID = "DIC_kwDOP75SYM4CwgqS"
mapping = "pathname"
strict = "0"
reactionsEnabled = "1"
emitMetadata = "0"
inputPosition = "bottom"
theme = "preferred_color_scheme"
lang = "en"
themeLight = "light"
themeDark = "dark"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[menus]
  [[menus.main]]
    name = 'Blog'
    url = '/blog/'
    weight = 10

  [[menus.main]]
    name = 'Photos'
    url = '/photos/'
    weight = 25

  [[menus.main]]
    name = 'Contact'
    url = '/contact/'
    weight = 30

[security]
  enableInlineShortcodes = true
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
noClasses = false
style = "monokai"
