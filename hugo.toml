baseURL = 'https://tenyoru.io/'
locale = 'en-us'
title = 'Tenyoru'
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
capitalizeListTitles = false

[languages]
  [languages.en]
    weight = 1
  [languages.fr]
    weight = 2
  [languages.ru]
    weight = 3

# ---------------------------------------------------------------------------
# Outputs
# Generates static/_headers as a Hugo output (see layouts/index.headers) so
# it can reference the current build's fingerprinted CSS URL for the Link
# preload header - a plain static/_headers file can't see that hash.
# ---------------------------------------------------------------------------

[mediaTypes."text/netlify"]
delimiter = ""
suffixes = []

[outputFormats.Headers]
mediaType = "text/netlify"
baseName = "_headers"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "RSS", "Headers"]

# ---------------------------------------------------------------------------
# Mounts
# First five mounts = Hugo defaults (declaring any mount disables them).
# The rest expose the site's own sources under assets/src/ for /src/.
# ---------------------------------------------------------------------------

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "content"
    target = "assets/src/content"
  [[module.mounts]]
    source = "layouts"
    target = "assets/src/layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets/src/assets"
  [[module.mounts]]
    source = "hugo.toml"
    target = "assets/src/hugo.toml"

# ---------------------------------------------------------------------------
# Markup
# ---------------------------------------------------------------------------

[markup.goldmark.renderer]
unsafe = true

# Chroma classes are styled in assets/scss/components/_chroma.scss
[markup.highlight]
noClasses = false
style = "monokai"

[security]
  enableInlineShortcodes = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

# ---------------------------------------------------------------------------
# Menus (Tags is intentionally not here - it's a small link in the blog header)
# ---------------------------------------------------------------------------

[menus]
  [[menus.main]]
    name = 'Blog'
    url = '/blog/'
    weight = 10

  [[menus.main]]
    name = 'Photos'
    url = '/photos/'
    weight = 25

  [[menus.main]]
    name = 'Contact'
    url = '/contact/'
    weight = 30

# ---------------------------------------------------------------------------
